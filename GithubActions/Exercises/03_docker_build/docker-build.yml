name: CI

on:
  push:
    branches: [ exercise_branch ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          docker build -t hello-ci-cd ./GithubActions/Exercises/03_docker_build